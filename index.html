<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI | Intelligent Chatbot</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <div class="logo-icon"><i class="fa-solid fa-bolt"></i></div>
                <span>Nexus AI</span>
            </div>

            <button class="new-chat-btn" onclick="startNewChat()">
                <i class="fa-solid fa-plus"></i> New Conversation
            </button>

            <div class="quick-nav">
                <span class="nav-title">Quick Actions</span>
                <button class="nav-item" onclick="sendPrompt('What time and date is it?')">
                    <i class="fa-regular fa-clock"></i> System Time
                </button>
                <button class="nav-item" onclick="sendPrompt('Tell me a developer joke')">
                    <i class="fa-solid fa-face-laugh-beam"></i> Tell a Joke
                </button>
                <button class="nav-item" onclick="sendPrompt('Give me a coding tip')">
                    <i class="fa-solid fa-lightbulb"></i> Coding Tip
                </button>
                <button class="nav-item" onclick="sendPrompt('What are your features?')">
                    <i class="fa-solid fa-list-check"></i> Command List
                </button>
            </div>

            <div class="sidebar-footer">
                <div class="user-badge">
                    <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
                    <div class="user-meta">
                        <span class="user-name">Guest User</span>
                        <span class="user-status">Online</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="main-content">
            <header class="topbar">
                <div class="engine-badge">
                    <span class="pulse-dot"></span> Rule-Based AI Engine Active
                </div>
                <button class="icon-action" onclick="clearMessages()" title="Clear Chat">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </header>

            <div class="chat-viewport" id="chatViewport">
                <div class="welcome-card" id="welcomeCard">
                    <div class="hero-icon"><i class="fa-solid fa-brain"></i></div>
                    <h2>How can I assist you today?</h2>
                    <p>Select a quick action on the left or type your query below.</p>
                </div>

                <div class="messages-container" id="messagesContainer"></div>
            </div>

            <!-- Input Bar -->
            <div class="input-wrapper">
                <form id="chatForm" class="input-container">
                    <input 
                        type="text" 
                        id="userQuery" 
                        placeholder="Message Nexus AI or ask for a calculation..." 
                        autocomplete="off"
                        required
                    />
                    <button type="submit" class="send-action">
                        <i class="fa-solid fa-arrow-up"></i>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
